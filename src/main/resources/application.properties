server.port=80

# Database 설정
# DB_TYPE 환경 변수로 선택: mysql 또는 postgresql (기본값: mysql)
# MySQL 사용 시: DB_TYPE=mysql (또는 생략), DB_HOST, DB_PORT(기본:3306), DB_NAME, DB_USERNAME, DB_PASSWORD
# PostgreSQL 사용 시: DB_TYPE=postgresql, DB_HOST, DB_PORT(기본:5432), DB_NAME, DB_USERNAME, DB_PASSWORD
# 하위 호환성: 기존 MY_SQL_HOST, MY_SQL_NAME, MY_SQL_PWD 환경 변수도 지원
# DatabaseConfig.java에서 DB_TYPE에 따라 자동으로 driver, url 설정

# Hibernate 쿼리 가독성 설정
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

logging.level.org.hibernate.type.descriptor.sql=trace

spring.jpa.hibernate.ddl-auto=update

spring.mvc.static-path-pattern=/resources/**
spring.thymeleaf.prefix=classpath:templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.check-template=true

# 콘솔 log 색상
spring.output.ansi.enabled=always

# oauth 설정 적용
spring.profiles.include=oauth

# 로그 수준 설정
logging.level.root=debug

# 이미지 저장 경로
boardImgLocation=${FILE_LOCATION}/board
uploadPath=file:///${FILE_LOCATION}/

spring.servlet.multipart.maxFileSize=20MB
spring.servlet.multipart.maxRequestSize=100MB
